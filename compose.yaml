services:
  db:
    restart: always
    image: postgres:17
    environment:
      POSTGRES_DB: context
      POSTGRES_USER: context
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-context}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U context -d context"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    restart: always
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://context:${POSTGRES_PASSWORD:-context}@db:5432/context
    command: ["sh", "-c", "rm -f /tmp/migration-ready && alembic upgrade head && touch /tmp/migration-ready && exec sleep infinity"]
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/migration-ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
  api:
    restart: always
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://context:${POSTGRES_PASSWORD:-context}@db:5432/context
    ports:
      - "0.0.0.0:8000:8000"
    depends_on:
      migrate:
        condition: service_healthy
  worker:
    restart: always
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://context:${POSTGRES_PASSWORD:-context}@db:5432/context
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_healthy
volumes:
  postgres_data:

